<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cổng Thông Tin Việc Làm & Tuyển Dụng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
  </style>
</head>
<body class="text-gray-800 pb-12">

  <!-- Header -->
  <header class="bg-blue-600 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-briefcase"></i> VIỆC LÀM KHO XƯỞNG
        </h1>
        <p class="text-xs text-blue-100">Kênh tuyển dụng trực tiếp lao động & thời vụ</p>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6">
    
    <!-- Thanh Tìm kiếm và Lọc -->
    <div class="bg-white p-4 rounded-xl shadow-sm mb-6 border border-gray-100 space-y-3">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Tìm kiếm theo tiêu đề, công việc, địa điểm, mức lương..." 
          class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
          oninput="filterJobs()"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <select id="filterLocation" onchange="filterJobs()" class="w-full p-2.5 text-xs rounded-lg border border-gray-200 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Tất cả Địa điểm / Khu vực</option>
          </select>
        </div>
        <div>
          <select id="filterPaySchedule" onchange="filterJobs()" class="w-full p-2.5 text-xs rounded-lg border border-gray-200 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Tất cả Lịch trả lương</option>
            <option value="ngày">Theo Ngày</option>
            <option value="tuần">Theo Tuần</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Danh sách việc làm -->
    <div id="jobList" class="space-y-4">
      <div class="text-center py-12 text-gray-500">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-600 mb-3"></i>
        <p class="text-sm">Đang tải danh sách bài tuyển dụng...</p>
      </div>
    </div>
  </main>

  <script>
    const ORIGINAL_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRvuzHWqXL8q97i9JcW2MRR0pmMqRk7-jXBJrHGRTCKdf5OdrLQ8BNCIuDSZsUt_Zov-TyuaqvOJLG0/pub?gid=0&single=true&output=tsv';
    const TSV_URL = `https://corsproxy.io/?${encodeURIComponent(ORIGINAL_URL)}`;

    let allJobs = [];

    function parseTSV(text) {
      const lines = text.split('\n');
      if (lines.length < 2) return [];

      const headers = lines[0].split('\t').map(h => h.trim().replace(/^"|"$/g, ''));
      const result = [];

      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const row = lines[i].split('\t').map(m => m.trim().replace(/^"|"$/g, ''));
        const obj = {};
        
        headers.forEach((header, index) => {
          obj[header] = row[index] || '';
        });
        
        result.push(obj);
      }
      return result;
    }

    async function loadJobs() {
      const container = document.getElementById('jobList');
      try {
        const response = await fetch(TSV_URL);
        const dataText = await response.text();
        const rawData = parseTSV(dataText);

        // Lọc các bài hiển thị (Trạng thái bỏ trống hoặc "Đang tuyển")
        allJobs = rawData.filter(job => {
          const status = (job['Trạng thái'] || job['Trạng Thái'] || '').toLowerCase();
          return status === '' || status === 'đang tuyển';
        });

        populateLocations(allJobs);
        renderJobs(allJobs);
      } catch (error) {
        console.error("Lỗi tải dữ liệu:", error);
        container.innerHTML = `
          <div class="bg-red-50 text-red-600 p-4 rounded-xl text-center text-sm border border-red-100">
            Không thể tải dữ liệu từ Google Sheet. Vui lòng kiểm tra lại kết nối.
          </div>
        `;
      }
    }

    function populateLocations(jobs) {
      const select = document.getElementById('filterLocation');
      const locations = new Set();
      jobs.forEach(job => {
        const loc = job['Địa điểm'] || job['Địa Điểm'];
        if (loc) locations.add(loc.trim());
      });
      locations.forEach(loc => {
        const opt = document.createElement('option');
        opt.value = loc;
        opt.textContent = loc;
        select.appendChild(opt);
      });
    }

    function renderJobs(jobs) {
      const container = document.getElementById('jobList');
      if (jobs.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-xl text-center text-gray-500 shadow-sm border border-gray-100">
            <i class="fa-solid fa-box-open text-4xl text-gray-300 mb-2"></i>
            <p>Không có bài tuyển dụng nào phù hợp.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = jobs.map(job => {
        const zaloPhone = (job['SĐT ZALO'] || job['SĐT Zalo'] || '').replace(/\D/g, '');
        const zaloLink = zaloPhone ? `https://zalo.me/${zaloPhone}` : '#';
        const title = job['Tiêu Đề'] || job['Tiêu đề'] || 'Tuyển dụng việc làm';
        const hrName = job['Tên HR'] || 'Bộ phận tuyển dụng';
        const status = job['Trạng thái'] || job['Trạng Thái'];

        // Các trường hệ thống đã xử lý riêng ở tiêu đề/footer nên sẽ được bỏ qua trong vòng lặp động bên dưới
        const excludedKeys = ['Mã Bài', 'Mã bài', 'Tiêu Đề', 'Tiêu đề', 'Tên HR', 'SĐT ZALO', 'SĐT Zalo', 'Trạng thái', 'Trạng Thái', 'Link map'];

        // Vòng lặp động: Tự động quét và sinh HTML cho tất cả các trường có dữ liệu
        let dynamicFieldsHTML = '';
        Object.entries(job).forEach(([key, val]) => {
          if (val && val.trim() !== '' && !excludedKeys.includes(key)) {
            let displayVal = val;
            
            // Nếu là trường Địa chỉ và có đính kèm Link map thì gắn nút xem bản đồ
            if ((key.toLowerCase() === 'địa chỉ') && (job['Link map'] || job['Link Map'])) {
              const mapLink = job['Link map'] || job['Link Map'];
              displayVal = `${val} <a href="${mapLink}" target="_blank" class="text-blue-600 underline font-medium ml-1">[Xem bản đồ]</a>`;
            }

            dynamicFieldsHTML += `
              <div class="flex flex-col sm:flex-row sm:items-start gap-1 py-1 border-b border-gray-100 last:border-none text-xs sm:text-sm">
                <span class="font-semibold text-gray-700 sm:w-36 shrink-0">• ${key}:</span>
                <span class="text-gray-600 flex-1">${displayVal}</span>
              </div>
            `;
          }
        });

        return `
          <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 hover:shadow-md transition space-y-3">
            
            <!-- Tiêu đề & Trạng thái -->
            <div class="flex justify-between items-start gap-2">
              <h2 class="text-base sm:text-lg font-bold text-gray-900">
                ${title}
              </h2>
              ${status ? `
                <span class="text-xs font-semibold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-md shrink-0">
                  ${status}
                </span>
              ` : ''}
            </div>

            <!-- Khung chứa toàn bộ các trường thông tin động -->
            <div class="bg-gray-50 rounded-lg p-3.5 space-y-1.5 border border-gray-100">
              ${dynamicFieldsHTML}
            </div>

            <!-- Footer: Thông tin HR & Nút Zalo -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 pt-2 border-t border-gray-100">
              <div class="text-xs text-gray-500">
                <i class="fa-solid fa-user-tie text-gray-400 mr-1"></i> HR: <strong class="text-gray-700">${hrName}</strong>
              </div>
              
              <a 
                href="${zaloLink}" 
                target="_blank" 
                class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs px-4 py-2.5 rounded-lg flex items-center justify-center gap-2 shadow-sm transition"
              >
                <i class="fa-solid fa-comment-dots"></i> Nhắn Zalo Ứng Tuyển
              </a>
            </div>

          </div>
        `;
      }).join('');
    }

    function filterJobs() {
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
      const location = document.getElementById('filterLocation').value.toLowerCase();
      const paySchedule = document.getElementById('filterPaySchedule').value.toLowerCase();

      const filtered = allJobs.filter(job => {
        const textToSearch = Object.values(job).join(' ').toLowerCase();

        const matchKeyword = !keyword || textToSearch.includes(keyword);
        const locVal = (job['Địa điểm'] || job['Địa Điểm'] || '').toLowerCase();
        const matchLocation = !location || locVal.includes(location);
        const payVal = (job['Lịch trả'] || job['Lịch Trả'] || '').toLowerCase();
        const matchPay = !paySchedule || payVal.includes(paySchedule);

        return matchKeyword && matchLocation && matchPay;
      });

      renderJobs(filtered);
    }

    loadJobs();
  </script>
</body>
</html>
