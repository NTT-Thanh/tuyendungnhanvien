<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tuyển Dụng Lao Động & Công Nhân</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
  </style>
</head>
<body class="text-gray-800 pb-12">

  <!-- Header -->
  <header class="bg-blue-600 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-briefcase"></i> VIỆC LÀM NHÀ XƯỞNG
        </h1>
        <p class="text-xs text-blue-100">Tìm kiếm & tuyển dụng công nhân, thời vụ trực tiếp</p>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-6">
    
    <!-- Thanh tìm kiếm & Bộ lọc nâng cao -->
    <div class="bg-white p-5 rounded-xl shadow-sm mb-6 border border-gray-100 space-y-4">
      
      <!-- Ô Tìm kiếm từ khóa -->
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Tìm công việc, tiêu đề, địa điểm..." 
          class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
          oninput="filterJobs()"
        />
      </div>

      <!-- Khung lọc tiêu chí -->
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
        
        <!-- Lọc Khu vực -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Khu Vực</label>
          <select id="filterLocation" onchange="filterJobs()" class="w-full p-2 text-xs rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option value="">Tất cả khu vực</option>
          </select>
        </div>

        <!-- Lọc Ngành nghề -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Ngành Nghề</label>
          <select id="filterCategory" onchange="filterJobs()" class="w-full p-2 text-xs rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option value="">Tất cả ngành nghề</option>
          </select>
        </div>

        <!-- Lọc Hình thức trả lương -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Lịch Trả Lương</label>
          <select id="filterPaySchedule" onchange="filterJobs()" class="w-full p-2 text-xs rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option value="">Tất cả hình thức</option>
            <option value="ngày">Theo Ngày</option>
            <option value="tuần">Theo Tuần</option>
            <option value="tháng">Theo Tháng</option>
          </select>
        </div>

        <!-- Lọc Ca làm việc -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Ca Làm Việc</label>
          <select id="filterShift" onchange="filterJobs()" class="w-full p-2 text-xs rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option value="">Tất cả các ca</option>
            <option value="hành chính">Hành chính (8h-17h)</option>
            <option value="ca">Theo ca (xoay ca)</option>
          </select>
        </div>

        <!-- Lọc Đãi ngộ / Thưởng -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Đãi Ngộ / Thưởng</label>
          <select id="filterBenefit" onchange="filterJobs()" class="w-full p-2 text-xs rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <option value="">Tất cả</option>
            <option value="cơm">Bao cơm / Bao ăn</option>
            <option value="chuyên cần">Có thưởng chuyên cần</option>
            <option value="tăng ca">Có tăng ca</option>
          </select>
        </div>

      </div>
    </div>

    <!-- Danh sách việc làm -->
    <div id="jobList" class="space-y-4">
      <div class="text-center py-12 text-gray-500">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-600 mb-3"></i>
        <p class="text-sm">Đang tải danh sách bài tuyển dụng...</p>
      </div>
    </div>
  </main>

  <script>
    const TSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRvuzHWqXL8q97i9JcW2MRR0pmMqRk7-jXBJrHGRTCKdf5OdrLQ8BNCIuDSZsUt_Zov-TyuaqvOJLG0/pub?gid=0&single=true&output=tsv';

    let allJobs = [];

    // Hàm đọc dữ liệu dạng TSV (Phân tách bởi tab \t)
    function parseTSV(text) {
      const lines = text.split('\n');
      if (lines.length < 2) return [];

      const headers = lines[0].split('\t').map(h => h.trim().replace(/^"|"$/g, ''));
      const result = [];

      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const row = lines[i].split('\t').map(m => m.trim().replace(/^"|"$/g, ''));
        const obj = {};
        
        headers.forEach((header, index) => {
          obj[header] = row[index] || '';
        });
        
        result.push(obj);
      }
      return result;
    }

    // Tải dữ liệu từ Google Sheets
    async function loadJobs() {
      const container = document.getElementById('jobList');
      try {
        const response = await fetch(TSV_URL);
        const dataText = await response.text();
        allJobs = parseTSV(dataText);

        populateDropdowns(allJobs);
        renderJobs(allJobs);
      } catch (error) {
        console.error("Lỗi tải dữ liệu:", error);
        container.innerHTML = `
          <div class="bg-red-50 text-red-600 p-4 rounded-xl text-center text-sm border border-red-100">
            Không thể tải dữ liệu tuyển dụng. Vui lòng kiểm tra lại kết nối.
          </div>
        `;
      }
    }

    // Tự động đổ dữ liệu Khu vực và Ngành nghề vào ô Lọc Select
    function populateDropdowns(jobs) {
      const locationSelect = document.getElementById('filterLocation');
      const categorySelect = document.getElementById('filterCategory');

      const locations = new Set();
      const categories = new Set();

      jobs.forEach(job => {
        if (job['Địa Điểm']) locations.add(job['Địa Điểm'].trim());
        if (job['Ngành Nghề']) categories.add(job['Ngành Nghề'].trim());
      });

      locations.forEach(loc => {
        const opt = document.createElement('option');
        opt.value = loc;
        opt.textContent = loc;
        locationSelect.appendChild(opt);
      });

      categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        categorySelect.appendChild(opt);
      });
    }

    // Hiển thị danh sách việc làm
    function renderJobs(jobs) {
      const container = document.getElementById('jobList');
      if (jobs.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-xl text-center text-gray-500 shadow-sm border border-gray-100">
            <i class="fa-solid fa-box-open text-4xl text-gray-300 mb-2"></i>
            <p>Không tìm thấy bài tuyển dụng phù hợp với bộ lọc.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = jobs.map(job => {
        const zaloPhone = (job['Số Điện Thoại Zalo'] || job['SĐT Zalo'] || '').replace(/\D/g, '');
        const zaloLink = zaloPhone ? `https://zalo.me/${zaloPhone}` : '#';

        return `
          <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 hover:shadow-md transition space-y-3">
            <div class="flex justify-between items-start">
              <span class="bg-blue-50 text-blue-700 text-xs font-semibold px-2.5 py-1 rounded-md">
                ${job['Ngành Nghề'] || 'Tuyển dụng'}
              </span>
              ${job['Lịch Trả Lương'] ? `
                <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">
                  ${job['Lịch Trả Lương']}
                </span>
              ` : ''}
            </div>

            <h2 class="text-lg font-bold text-gray-900">
              ${job['Tiêu Đề'] || 'Bài tuyển dụng'}
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-gray-600">
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-coins text-amber-500 w-4"></i>
                <span class="font-bold text-red-600">${job['Mức Lương'] || 'Thỏa thuận'}</span>
              </div>
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-clock text-blue-500 w-4"></i>
                <span>${job['Ca Làm Việc'] || 'Theo ca'}</span>
              </div>
              <div class="flex items-center gap-2 sm:col-span-2">
                <i class="fa-solid fa-location-dot text-rose-500 w-4"></i>
                <span>${job['Địa Điểm'] || 'Chưa cập nhật'}</span>
              </div>
            </div>

            <div class="bg-gray-50 rounded-lg p-3 text-xs text-gray-600 space-y-1.5">
              ${job['Thưởng & Tăng Ca'] ? `<div><strong>➕ Thưởng & Phụ cấp:</strong> ${job['Thưởng & Tăng Ca']}</div>` : ''}
              ${job['Yêu Cầu'] ? `<div><strong>✅ Yêu cầu:</strong> ${job['Yêu Cầu']}</div>` : ''}
              ${job['Mô Tả Công Việc'] ? `<div><strong>📦 Mô tả công việc:</strong> ${job['Mô Tả Công Việc']}</div>` : ''}
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 pt-2 border-t border-gray-100">
              <div class="text-xs text-gray-500 w-full sm:w-auto">
                <i class="fa-solid fa-user-tie text-gray-400 mr-1"></i> HR Hỗ trợ: <strong class="text-gray-700">${job['Tên HR'] || 'Tư vấn viên'}</strong>
              </div>
              
              <a 
                href="${zaloLink}" 
                target="_blank" 
                class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm px-5 py-2.5 rounded-lg flex items-center justify-center gap-2 shadow-sm transition"
              >
                <i class="fa-comment-dots"></i> Nhắn Zalo Ứng Tuyển
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    // Hàm lọc dữ liệu kết hợp tất cả bộ lọc
    function filterJobs() {
      const searchKeyword = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedLocation = document.getElementById('filterLocation').value.toLowerCase();
      const selectedCategory = document.getElementById('filterCategory').value.toLowerCase();
      const selectedPaySchedule = document.getElementById('filterPaySchedule').value.toLowerCase();
      const selectedShift = document.getElementById('filterShift').value.toLowerCase();
      const selectedBenefit = document.getElementById('filterBenefit').value.toLowerCase();

      const filtered = allJobs.filter(job => {
        const title = (job['Tiêu Đề'] || '').toLowerCase();
        const location = (job['Địa Điểm'] || '').toLowerCase();
        const category = (job['Ngành Nghề'] || '').toLowerCase();
        const salary = (job['Mức Lương'] || '').toLowerCase();
        const paySchedule = (job['Lịch Trả Lương'] || '').toLowerCase();
        const shift = (job['Ca Làm Việc'] || '').toLowerCase();
        const benefit = (job['Thưởng & Tăng Ca'] || '').toLowerCase();
        const desc = (job['Mô Tả Công Việc'] || '').toLowerCase();

        // 1. Kiểm tra từ khóa tìm kiếm
        const matchesKeyword = !searchKeyword || 
          title.includes(searchKeyword) || 
          location.includes(searchKeyword) || 
          category.includes(searchKeyword) || 
          salary.includes(searchKeyword) || 
          desc.includes(searchKeyword);

        // 2. Kiểm tra Địa điểm
        const matchesLocation = !selectedLocation || location.includes(selectedLocation);

        // 3. Kiểm tra Ngành nghề
        const matchesCategory = !selectedCategory || category.includes(selectedCategory);

        // 4. Kiểm tra Hình thức trả lương (Ngày/Tuần/Tháng)
        const matchesPaySchedule = !selectedPaySchedule || paySchedule.includes(selectedPaySchedule);

        // 5. Kiểm tra Ca làm việc
        let matchesShift = true;
        if (selectedShift === 'hành chính') {
          matchesShift = shift.includes('8h') || shift.includes('hành chính');
        } else if (selectedShift === 'ca') {
          matchesShift = shift.includes('ca 1') || shift.includes('ca 2') || shift.includes('6h') || shift.includes('14h');
        }

        // 6. Kiểm tra Thưởng & Đãi ngộ
        let matchesBenefit = true;
        if (selectedBenefit) {
          matchesBenefit = benefit.includes(selectedBenefit);
        }

        return matchesKeyword && matchesLocation && matchesCategory && matchesPaySchedule && matchesShift && matchesBenefit;
      });

      renderJobs(filtered);
    }

    loadJobs();
  </script>
</body>
</html>
